<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uicurio · prototype (throwaway)</title>
<!-- PROTOTYPE — throwaway. Three structural variants of the gallery, ?v=A|B|C + floating bar. Question: which filter/card anatomy feels right? -->
<style>
  :root{
    --bg:#fff; --text-1:#0b0b0b; --text-2:#6f6f6f; --border:#ececee; --surface-2:#f5f5f5;
    --ink:#171717; --r-card:8px; --r-chip:9999px;
    --sans:'Inter Variable','Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--text-1);font-size:14px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  img{display:block;width:100%;height:100%;object-fit:cover}
  button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}

  /* ---------- shared bits ---------- */
  .logo{font-weight:600;letter-spacing:-.02em}
  .tagline{color:var(--text-2);font-size:13px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--r-chip);background:var(--surface-2);font-size:13px;border:1px solid transparent}
  .chip .n{color:var(--text-2);font-variant-numeric:tabular-nums}
  .chip[aria-pressed=true]{background:var(--ink);color:#fff}
  .chip[aria-pressed=true] .n{color:rgba(255,255,255,.6)}
  .card{border-radius:var(--r-card);overflow:hidden;display:block}
  .cover{aspect-ratio:16/10;background:var(--surface-2);position:relative;overflow:hidden}
  .cover img{transition:transform .12s ease-out}
  .card:hover .cover img{transform:scale(1.02)}
  .jump{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;opacity:.92}
  .meta{padding:10px 2px}
  .meta .t{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:baseline}
  .meta .t span{font-weight:400;color:var(--text-2);font-size:13px}
  .meta .d{font-size:13px;color:var(--text-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .grid{display:grid;gap:20px 12px}
  @media(min-width:640px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}}

  /* ---------- V A : chip toolbar ---------- */
  .va-head{padding:28px 32px 0}
  .va-toolbar{padding:16px 32px 14px;border-bottom:1px solid var(--border);display:grid;gap:8px}
  .va-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .va-row .lab{font-size:12px;color:var(--text-2);width:72px;flex:none}
  .va-search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:5px 10px}
  .va-search input{border:0;outline:0;font:inherit;font-size:13px;width:180px;background:none}
  .va-main{padding:20px 32px 80px}
  .va-count{font-size:13px;color:var(--text-2);margin-bottom:12px;font-variant-numeric:tabular-nums}

  /* ---------- V B : sidebar ---------- */
  .vb{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  .vb-side{border-right:1px solid var(--border);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}
  .vb-side .logo{font-size:15px}
  .vb-group{margin-top:22px}
  .vb-group h3{font-size:12px;color:var(--text-2);font-weight:400;margin-bottom:6px}
  .vb-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:4px 8px;border-radius:6px;font-size:13px}
  .vb-item .n{margin-left:auto;color:var(--text-2);font-variant-numeric:tabular-nums}
  .vb-item[aria-pressed=true]{font-weight:600}
  .vb-item[aria-pressed=true]::before{content:"•"}
  .vb-item:not([aria-pressed=true])::before{content:"";width:7px}
  .vb-main{padding:28px 32px 80px}
  .vb-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .vb-top h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
  .vb-top .va-search{margin-left:auto}

  /* ---------- V C : magazine index ---------- */
  .vc-head{padding:48px 40px 8px;max-width:1080px}
  .vc-head h1{font-size:32px;font-weight:600;letter-spacing:-.02em}
  .vc-head p{color:var(--text-2);margin-top:6px}
  .vc-sec{padding:26px 40px 10px;max-width:1080px}
  .vc-sec>header{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--border);padding-top:14px}
  .vc-sec>header h2{font-size:16px;font-weight:600}
  .vc-sec>header .pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .pill{font-size:12px;padding:2px 10px;border-radius:var(--r-chip);background:var(--surface-2);color:var(--text-2)}
  .vc-strip{display:grid;grid-auto-flow:column;grid-auto-columns:272px;gap:12px;overflow-x:auto;padding:12px 0 18px;scroll-snap-type:x mandatory}
  .vc-strip .card{scroll-snap-align:start}

  /* ---------- detail overlay ---------- */
  .detail{position:fixed;inset:0;background:rgba(255,255,255,.96);display:none;overflow:auto;z-index:20}
  .detail.open{display:block}
  .detail-in{max-width:720px;margin:0 auto;padding:56px 32px 80px}
  .detail .cover{max-height:380px;border:1px solid var(--border)}
  .detail h1{font-size:32px;font-weight:600;letter-spacing:-.02em;margin:18px 0 6px}
  .detail .d{color:var(--text-2);font-size:15px}
  .detail .btns{display:flex;gap:8px;margin:18px 0}
  .btn{padding:7px 16px;border-radius:8px;font-size:14px;font-weight:500}
  .btn.pri{background:var(--ink);color:#fff}
  .btn.ghost{border:1px solid var(--border)}
  .detail .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px}
  .detail h3{font-size:13px;color:var(--text-2);font-weight:400;margin-bottom:10px}
  .close{position:fixed;top:16px;right:20px;font-size:13px;color:var(--text-2);background:var(--surface-2);padding:6px 12px;border-radius:var(--r-chip)}

  /* ---------- floating switcher (prototype chrome, not the design) ---------- */
  .bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:#111;color:#fff;border-radius:9999px;padding:5px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:40;font-size:13px}
  .bar button{color:#fff;padding:6px 12px;border-radius:9999px}
  .bar button:hover{background:rgba(255,255,255,.15)}
  .bar .cur{padding:6px 10px;color:#bbb}
  .bar .cur b{color:#fff}
</style>
</head>
<body>
<div id="app"></div>

<div class="detail" id="detail"><div class="detail-in" id="detailIn"></div>
  <button class="close" onclick="closeDetail()">Esc · close</button>
</div>

<div class="bar" id="bar">
  <button onclick="cycle(-1)" aria-label="previous variant">←</button>
  <span class="cur" id="barCur"></span>
  <button onclick="cycle(1)" aria-label="next variant">→</button>
</div>

<script>
const CATS = {collections:"Collections", "input-controls":"Input Controls", "files-code":"Files & Code", "loading-feedback":"Loading & Feedback", "data-viz":"Data Viz", "text-typography":"Text & Typography"};
const TAGN = {diff:"diff","file-tree":"file tree","loading-indicator":"loading","card-input":"card input","color-picker":"color picker",chart:"chart",animation:"animation","3d":"3d",pdf:"pdf",dial:"dial","sound-effects":"sound","text-animation":"text anim","ai-native":"ai-native",realtime:"realtime",cozy:"cozy","design-engineer":"design-eng",react:"React",vue:"Vue",svelte:"Svelte",solid:"Solid","vanilla-js":"vanilla JS",typescript:"TypeScript",nextjs:"Next.js",tailwind:"Tailwind",shadcn:"shadcn",threejs:"Three.js",webgl:"WebGL",canvas:"Canvas","web-audio":"Web Audio","zero-dependency":"zero-dep",motion:"Motion"};

const ITEMS = [
["beautiful-ui","collections",["scenario:ai-native"],"Curated components and patterns for AI-native interfaces."],
["diffs","files-code",["function:diff"],"Render code snippets and file diffs — unified/split, merge conflicts, inline editing — built on Shiki."],
["trees","files-code",["function:file-tree"],"File-tree rendering with virtualization, Git status, drag-and-drop, search, context menus."],
["orbs","loading-feedback",["function:loading-indicator","function:animation"],"Animated thinking-orb loading indicator for processing and AI states."],
["crd-ui","input-controls",["function:card-input","stack:react","stack:vue","stack:svelte","stack:vanilla-js"],"Dependency-free interactive card components — brand detection, masking, 3D flip."],
["color-picker-paper","input-controls",["function:color-picker"],"Recreation of the Paper app color picker; parses hex/RGB/HSL/HSB/p3/OKLCH."],
["liveline","data-viz",["function:chart","function:animation","stack:react","stack:canvas","scenario:realtime"],"Real-time animated line chart for React; canvas 60fps for streaming data; OHLC + crosshair."],
["beui","collections",["function:animation","stack:react","stack:nextjs","stack:tailwind","stack:shadcn","stack:motion"],"Open-source animated components for React/Next.js; Motion + Tailwind; shadcn CLI."],
["threeui","collections",["function:animation","function:3d","stack:threejs","stack:webgl"],"Interactive Three.js components, templates and shaders with polished motion."],
["pdfcn","files-code",["function:pdf","stack:shadcn"],"Beautiful, accessible, customizable PDF components; works with shadcn/ui."],
["dialkit","input-controls",["function:dial","stack:react","stack:solid","stack:svelte","stack:vue","stack:vanilla-js"],"Live dial controls; tune motion, layout, color and animation timing in place."],
["cuelume","loading-feedback",["function:sound-effects","stack:web-audio","stack:zero-dependency"],"Tiny dependency-free library of interaction sounds, synthesized live with Web Audio."],
["animal-island-ui","collections",["style:cozy","stack:react","stack:typescript"],"Lightweight React+TS library (33 components) with an original cozy island design; WAI-ARIA."],
["math-curve-loaders","loading-feedback",["function:loading-indicator","function:animation"],"Mathematical loading animations; formula-driven curves with live controls and code export."],
["spell-ui","collections",["style:design-engineer","stack:react","stack:tailwind"],"Refined copy-paste React + Tailwind components for design engineers."],
["calligraph","text-typography",["style:design-engineer","stack:react","stack:motion","function:text-animation"],"Fluid text transitions powered by Motion; shared characters slide to new positions."],
["stepwise-ui","collections",["stack:react","stack:tailwind"],"Growing copy-paste collection with its own CLI registry; React 19, Tailwind v4."],
["opensource-ui","collections",["stack:react","stack:typescript","stack:nextjs","stack:tailwind"],"MIT copy-paste components for React/Next.js — 150+ production-ready, live previews."],
["bencho","collections",["style:design-engineer","stack:react","stack:motion"],"Live component bench — every block is live and adjustable; React + Motion."],
["spectrum-ui","collections",["scenario:ai-native","function:animation","stack:react","stack:nextjs","stack:tailwind","stack:shadcn","stack:motion"],"Animation-ready components and blocks for SaaS and AI apps; blends Aceternity/Magic/shadcn."],
].map(([slug,cat,tags,desc])=>({slug,cat,tags,desc,name:slug.replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase())}));

const state = { f:new Set(), cat:null, q:"" };
const count = p => ITEMS.filter(p).length;
const filtered = () => ITEMS.filter(i =>
  (!state.cat || i.cat===state.cat) &&
  [...state.f].every(t=>i.tags.includes(t)) &&
  (!state.q || (i.name+" "+i.desc).toLowerCase().includes(state.q)));

function card(i,extra=""){return `<a class="card ${extra}" href="#" onclick="openDetail('${i.slug}');return false">
  <div class="cover"><img loading="lazy" src="../assets/shots/${i.slug}.webp" alt="${i.name}"><span class="jump">↗</span></div>
  <div class="meta"><div class="t">${i.name}<span>${TAGN[i.tags[0].split(":")[1]] ?? ""}</span></div><div class="d">${i.desc}</div></div></a>`;}

/* ---------- A · chip toolbar ---------- */
function vA(){
  const facet=(lab,pre,list)=>`<div class="va-row"><span class="lab">${lab}</span>${list.map(t=>{const n=count(i=>i.tags.includes(pre+t));if(!n)return;return `<button class="chip" aria-pressed="${state.f.has(pre+t)}" onclick="tog('${pre+t}')">${TAGN[t]} <span class="n">${n}</span></button>`}).filter(Boolean).join("")}</div>`;
  return `<div class="va-head"><span class="logo">uicurio</span> <span class="tagline">— a curio cabinet of hand-picked UI libraries</span></div>
  <div class="va-toolbar">
    <div class="va-row"><span class="lab">Browse</span>${Object.keys(CATS).map(c=>`<button class="chip" aria-pressed="${state.cat===c}" onclick="setCat('${c}')">${CATS[c]} <span class="n">${count(i=>i.cat===c)}</span></button>`).join("")}</div>
    ${facet("Function","function:",["diff","file-tree","loading-indicator","card-input","color-picker","chart","animation","3d","pdf","dial","sound-effects","text-animation"])}
    ${facet("Stack","stack:",["react","vue","svelte","solid","vanilla-js","typescript","nextjs","tailwind","shadcn","threejs","webgl","canvas","web-audio","zero-dependency","motion"])}
    ${facet("Style","style:",["cozy","design-engineer"])}
    ${facet("Scenario","scenario:",["ai-native","realtime"])}
    <div class="va-row"><span class="lab">Search</span><span class="va-search"><input placeholder="Filter ${ITEMS.length} libraries…" value="${esc(state.q)}" oninput="setQuery(this.value)"></span></div>
  </div>
  <div class="va-main"><div class="va-count">${filtered().length} libraries</div><div class="grid c3">${filtered().map(i=>card(i)).join("")}</div></div>`;
}

/* ---------- B · sidebar ---------- */
function vB(){
  const grp=(lab,pre,list)=>`<div class="vb-group"><h3>${lab}</h3>${list.map(t=>{const n=count(i=>i.tags.includes(pre+t));if(!n)return;return `<button class="vb-item" aria-pressed="${state.f.has(pre+t)}" onclick="tog('${pre+t}')">${TAGN[t]}<span class="n">${n}</span></button>`}).filter(Boolean).join("")}</div>`;
  return `<div class="vb"><aside class="vb-side">
    <span class="logo">uicurio</span><div class="tagline" style="margin-top:2px">hand-picked UI libraries</div>
    <div class="vb-group"><h3>Browse</h3><button class="vb-item" aria-pressed="${!state.cat}" onclick="setCat('')">All<span class="n">${ITEMS.length}</span></button>
    ${Object.keys(CATS).map(c=>`<button class="vb-item" aria-pressed="${state.cat===c}" onclick="setCat('${c}')">${CATS[c]}<span class="n">${count(i=>i.cat===c)}</span></button>`).join("")}</div>
    ${grp("Function","function:",["diff","file-tree","loading-indicator","card-input","color-picker","chart","animation","3d","pdf","dial","sound-effects","text-animation"])}
    ${grp("Stack","stack:",["react","vue","svelte","solid","vanilla-js","typescript","nextjs","tailwind","shadcn","threejs","webgl","canvas","web-audio","zero-dependency","motion"])}
    ${grp("Style","style:",["cozy","design-engineer"])}${grp("Scenario","scenario:",["ai-native","realtime"])}
  </aside>
  <main class="vb-main"><div class="vb-top"><h1>${state.cat?CATS[state.cat]:"All libraries"}</h1>
    <span class="va-search"><input placeholder="Search…" value="${esc(state.q)}" oninput="setQuery(this.value)"></span></div>
    <div class="grid c2">${filtered().map(i=>card(i)).join("")}</div></main></div>`;
}

/* ---------- C · magazine index ---------- */
function vC(){
  return `<div class="vc-head"><h1>uicurio</h1><p>A curio cabinet of ${ITEMS.length} hand-picked UI libraries — every piece tried, none filler. Updated as I find new gems.</p></div>
  ${Object.keys(CATS).map(c=>{const list=ITEMS.filter(i=>i.cat===c);if(!list.length)return"";
    const tags=[...new Set(list.flatMap(i=>i.tags.map(t=>t.split(":")[1])))].slice(0,6);
    return `<section class="vc-sec"><header><h2>${CATS[c]}</h2><span class="tagline">${list.length}</span>
      <span class="pills">${tags.map(t=>`<span class="pill">${TAGN[t]??t}</span>`).join("")}</span></header>
      <div class="vc-strip">${list.map(i=>card(i)).join("")}</div></section>`}).join("")}
  <div style="height:60px"></div>`;
}

/* ---------- wiring ---------- */
// 安全渲染：DOMParser 解析（不用 innerHTML 赋值）；动态文本一律 esc() 后再入模板
const mount = (el, html) => el.replaceChildren(...new DOMParser().parseFromString(`<body>${html}</body>`, "text/html").body.childNodes);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const V={A:["Chip toolbar",vA],B:["Sidebar",vB],C:["Magazine index",vC]};
let cur=new URLSearchParams(location.search).get("v")||"A";
if(!V[cur])cur="A";

function render(){mount(document.getElementById("app"),V[cur][1]());
  document.getElementById("barCur").textContent=`${cur} · ${V[cur][0]}`;}
function tog(t){state.f.has(t)?state.f.delete(t):state.f.add(t);render()}
function setCat(c){state.cat=(c&&state.cat===c)?"":(c||null);if(state.cat==="")state.cat=null;render()}
function setQuery(v){state.q=v.toLowerCase();const g=document.getElementById("app").querySelector("input");render();const n=document.getElementById("app").querySelector("input");if(n){n.focus();n.setSelectionRange(v.length,v.length)}}
function cycle(d){const k=Object.keys(V);cur=k[(k.indexOf(cur)+d+k.length)%k.length];history.replaceState(null,"",`?v=${cur}`);render()}
function openDetail(slug){const i=ITEMS.find(x=>x.slug===slug);
  const fn=i.tags.filter(t=>t.startsWith("function:")).map(t=>t.split(":")[1]);
  const alt=ITEMS.filter(x=>x.slug!==slug&&x.tags.some(t=>fn.includes(t.split(":")[1])));
  mount(document.getElementById("detailIn"),`
    <div class="cover"><img src="../assets/shots/${i.slug}.webp" alt=""></div>
    <h1>${i.name}</h1><p class="d">${i.desc}</p>
    <div class="btns"><a class="btn pri" href="#" onclick="return false">Visit site ↗</a><a class="btn ghost" href="#" onclick="return false">Source</a></div>
    <div class="chips">${i.tags.map(t=>`<span class="pill">${TAGN[t.split(":")[1]]??t}</span>`).join("")}</div>
    ${alt.length?`<h3>Alternatives — same function</h3><div class="grid c2">${alt.slice(0,4).map(x=>card(x)).join("")}</div>`:""}`);
  document.getElementById("detail").classList.add("open");document.body.style.overflow="hidden";}
function closeDetail(){document.getElementById("detail").classList.remove("open");document.body.style.overflow=""}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeDetail();
  if(/INPUT|TEXTAREA/.test(document.activeElement?.tagName||"")||document.activeElement?.isContentEditable)return;
  if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1);});
render();
</script>
</body>
</html>
